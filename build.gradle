plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = mod_version
group = mod_group_id

// Increments the patch version on every build, then updates the project version used by the jar.
tasks.register('bumpVersion') {
    doLast {
        def propsFile = file('gradle.properties')
        def props = new Properties()
        props.load(new FileInputStream(propsFile))

        def currentVersion = props.getProperty('mod_version')
        if (!currentVersion) {
            throw new GradleException('mod_version is missing from gradle.properties')
        }

        def matcher = (currentVersion =~ /(\d+)\.(\d+)\.(\d+)/)
        if (!matcher.matches()) {
            throw new GradleException("mod_version must use semantic versioning like 0.1.0, got '${currentVersion}'")
        }

        def major = matcher[0][1].toInteger()
        def minor = matcher[0][2].toInteger()
        def patch = matcher[0][3].toInteger() + 1
        def nextVersion = "${major}.${minor}.${patch}"

        props.setProperty('mod_version', nextVersion)
        props.store(new FileOutputStream(propsFile), 'Auto-incremented mod version on build')

        project.version = nextVersion
        logger.lifecycle("Version bumped from ${currentVersion} to ${nextVersion}")
    }
}

tasks.named('jar') { dependsOn tasks.named('bumpVersion') }
tasks.named('build') { dependsOn tasks.named('bumpVersion') }

base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach { workingDirectory project.file('run'); property 'forge.logging.console.level', 'debug'; mods { "${mod_id}" { source sourceSets.main } } }
        client { }
        server { args '--nogui' }
        gameTestServer { }
        data { args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/') }
    }
}
sourceSets.main.resources { srcDir 'src/generated/resources' }
dependencies { minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}" }
tasks.named('processResources', ProcessResources).configure {
    var props = [mod_id:mod_id, mod_name:mod_name, mod_license:mod_license, mod_version:mod_version, mod_authors:mod_authors, mod_description:mod_description]
    inputs.properties props
    filesMatching(['META-INF/mods.toml','pack.mcmeta']) { expand props }
}
jar.finalizedBy('reobfJar')
